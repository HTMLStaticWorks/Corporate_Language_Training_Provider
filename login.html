<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaPro | Login</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="auth-page">

  <div class="auth-container">
    <!-- Auth Toggles -->
    <div class="auth-toggles">
      <button class="icon-btn theme-toggle" aria-label="Toggle Dark Mode"><i class="ph ph-moon"></i></button>
      <button class="icon-btn rtl-toggle" aria-label="Toggle RTL"><i class="ph ph-arrows-left-right"></i></button>
    </div>

    <div class="auth-card">
      <!-- Logo -->
      <a href="index.html" class="logo">
        <img src="assets/images/logo.svg" alt="LinguaPro Logo" style="height: 40px; width: auto;">
      </a>

      <h2 class="mb-4 text-center" style="font-size: 1.5rem;">Sign in to your account</h2>

      <!-- Login Form -->
      <form action="#" method="POST" data-validate onsubmit="simulateLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required placeholder="">
          <div class="error-message">Valid email is required</div>
        </div>

        <div class="form-group mb-2">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" name="password" id="password-field" required placeholder="">
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password-field', this)"
              aria-label="Toggle Password Visibility">
              <i class="ph ph-eye"></i>
            </button>
          </div>
          <div class="error-message">Password is required</div>
        </div>

        <div class="d-flex align-center justify-between" style="margin-bottom: 24px; white-space: nowrap; gap: 8px;">
          <label class="checkbox-label"
            style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; user-select: none; white-space: nowrap; flex-shrink: 0;">
            <input type="checkbox" name="remember" style="margin: 0; width: auto;">
            <span style="font-size: 0.85rem; color: var(--color-muted);">Remember me</span>
          </label>
          <a href="#" style="font-size: 0.85rem; font-weight: 510; white-space: nowrap; flex-shrink: 0;">Forgot
            password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">or</div>

      <!-- SSO -->
      <button class="btn btn-google btn-full"
        style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4"
            d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.84 2.07-1.79 2.7v2.24h2.9c1.7-1.57 2.69-3.88 2.69-6.57z" />
          <path fill="#34A853"
            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.24c-.8.54-1.84.87-3.06.87-2.35 0-4.33-1.58-5.04-3.71H.92v2.32C2.4 15.97 5.51 18 9 18z" />
          <path fill="#FBBC05"
            d="M3.96 10.74A5.4 5.4 0 0 1 3.6 9c0-.6.1-1.2.27-1.74V4.94H.92A8.99 8.99 0 0 0 0 9c0 1.48.36 2.89.99 4.14l2.97-2.4z" />
          <path fill="#EA4335"
            d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.51 0 2.4 2.03.92 4.94l2.97 2.32c.71-2.13 2.69-3.71 5.04-3.71z" />
        </svg>
        Continue with Google
      </button>

      <button class="btn btn-microsoft btn-full"
        style="margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
          <path
            d="M15.56 9.4c-.04-2.2 1.8-3.26 1.88-3.32-1.02-1.5-2.62-1.7-3.18-1.74-1.34-.14-2.62.8-3.3.8-.68 0-1.74-.78-2.86-.76-1.48.02-2.84.86-3.6 2.18-1.54 2.68-.4 6.64 1.1 8.8 1.48 2.12 2.64 3.64 3.76 3.6 1.08-.04 1.5-.7 2.8-.7s1.68.7 2.8.66c1.14-.02 2.18-1.38 2.92-2.46.86-1.24 1.2-2.44 1.22-2.5-.04-.02-2.34-.9-2.38-3.56zM12.92 2.9c.6-.74 1.02-1.76.9-2.78-.88.04-1.94.58-2.58 1.34-.56.66-1.04 1.68-.92 2.7.98.08 1.98-.48 2.6-1.26z" />
        </svg>
        Continue with Apple
      </button>

      <div style="font-size: 0.9rem; color: var(--color-muted);">
        Don't have an account? <a href="register.html" style="font-weight: 510;">Register here</a>
      </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
      function simulateLogin(e) {
        e.preventDefault();
        // Only set localstorage if validation passes (main.js handles validation first, 
        // but to be safe, we'll just check if the form is valid)
        if (e.target.checkValidity()) {
          localStorage.setItem('linguapro-logged-in', 'true');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000); // Redirect after small delay
        }
      }
      function togglePasswordVisibility(fieldId, button) {
        const field = document.getElementById(fieldId);
        const icon = button.querySelector('i');
        if (field.type === 'password') {
          field.type = 'text';
          icon.className = 'ph ph-eye-slash';
        } else {
          field.type = 'password';
          icon.className = 'ph ph-eye';
        }
      }
    </script>
</body>

</html>
